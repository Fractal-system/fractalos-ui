<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#151517">
<title>FractalOS · Композер</title>
<style>
/* Шрифты. На Windows хозяина первым сработает Segoe UI; Open Sans — замена для снимков. */
@font-face{font-family:"Open Sans";font-weight:400;font-display:swap;src:url("../../assets/fonts/open-sans-cyrillic-400-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Open Sans";font-weight:400;font-display:swap;src:url("../../assets/fonts/open-sans-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Open Sans";font-weight:600;font-display:swap;src:url("../../assets/fonts/open-sans-cyrillic-600-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Open Sans";font-weight:600;font-display:swap;src:url("../../assets/fonts/open-sans-latin-600-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Cascadia Mono";font-weight:400;font-display:swap;src:url("../../assets/fonts/cascadia-mono-cyrillic-400-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Cascadia Mono";font-weight:400;font-display:swap;src:url("../../assets/fonts/cascadia-mono-latin-400-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Cascadia Mono";font-weight:600;font-display:swap;src:url("../../assets/fonts/cascadia-mono-cyrillic-600-normal.woff2") format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:"Cascadia Mono";font-weight:600;font-display:swap;src:url("../../assets/fonts/cascadia-mono-latin-600-normal.woff2") format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2212,U+2215,U+FEFF,U+FFFD}

:root{
  --bg:#1C1C1C; --bg-sunk:#151517; --bg-raise:#232327; --bg-hover:#2B2B31; --bg-code:#18181B;
  --line:#34343B; --line-ctrl:#6A6A72;
  --fg:#E4E4E4; --fg-2:#A8A8B0; --fg-3:#8E8E97;
  --teal:#09F5E5; --teal-dim:#3AB8AF; --teal-wash:rgba(9,245,229,.09); --ink:#151517; --select:#1F5353;
  --gold:#E2A84A; --gold-wash:rgba(226,168,74,.08); --gold-line:rgba(226,168,74,.6);
  --red:#E06A5E; --red-text:#EC8579; --red-wash:rgba(224,106,94,.08);
  --green:#5BC98A;
  --owner:#9B59D0; --owner-text:#B98AE6; --owner-wash:rgba(155,89,208,.09);
  --c-kw:#E2A84A; --c-str:#D9A25F; --c-fn:#8FA7F0; --c-com:#6E8A7A; --c-const:#E08FC0; --c-name:#B8B8C4;
  --font-ui:"Segoe UI Variable Text","Segoe UI","Open Sans",system-ui,sans-serif;
  --font-mono:"Cascadia Mono",ui-monospace,Consolas,monospace;
  --r-s:4px; --r-m:6px; --r-l:10px;
  --t:160ms; --ease:cubic-bezier(.16,1,.3,1);
  --gutter:96px; --col:1000px;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:400 14px/1.45 var(--font-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
::selection{background:var(--select);color:#fff}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button{font:inherit;color:inherit;cursor:pointer}
kbd{font:400 12px var(--font-mono);color:var(--fg-3)}
code,.mono{font-family:var(--font-mono)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ico.s12{width:12px;height:12px}
.st-ok{color:var(--green)} .st-warn{color:var(--gold)} .st-down{color:var(--red)} .st-off{color:var(--fg-3)} .st-live{color:var(--teal)}
*{scrollbar-width:thin;scrollbar-color:#3A3A42 transparent}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#3A3A42;border-radius:6px;border:2px solid var(--bg)} ::-webkit-scrollbar-track{background:transparent}

/* ---------- окно ---------- */
.win{position:fixed;inset:0;display:grid;grid-template-rows:40px 32px minmax(0,1fr);border:1px solid var(--line);background:var(--bg)}

/* заголовок */
.titlebar{display:flex;align-items:stretch;background:var(--bg-sunk);padding-left:6px;user-select:none;min-width:0}
.proj{display:flex;align-items:center;gap:8px;margin:5px 10px 5px 0;padding:0 10px 0 6px;border:0;border-radius:var(--r-m);background:none;min-width:0}
.proj:hover{background:var(--bg-hover)}
.proj img{width:20px;height:20px}
.proj-name{font-weight:600;font-size:14px}
.proj-path{font:400 12px var(--font-mono);color:var(--fg-3)}
.proj .ico{color:var(--fg-3)}
.tabs{display:flex;align-items:stretch}
.tabgrp{display:flex;align-items:stretch}
.tab{position:relative;display:flex;align-items:center;gap:8px;padding:0 14px;border:0;background:none;color:var(--fg-2);font-size:13px}
.tab-side{align-self:center;display:grid;place-items:center;width:24px;height:24px;margin:0 6px 0 -10px;border:0;border-radius:6px;background:none;color:var(--fg-3)}
.tab-side:hover{background:var(--bg-hover);color:var(--fg)}
.tab-side[aria-pressed="true"]{background:var(--select);color:var(--teal)}
.tab-side .ico{width:14px;height:14px}
.help-btn{align-self:center;display:grid;place-items:center;width:28px;height:28px;margin-right:6px;border:1px solid var(--line);border-radius:var(--r-m);background:none;color:var(--fg-2);font-weight:600;font-size:14px}
.help-btn:hover{border-color:var(--line-ctrl);color:var(--fg)}
.tab:hover{color:var(--fg);background:var(--bg-hover)}
.tab[aria-current="page"]{color:var(--fg)}
.tab[aria-current="page"]::after{content:"";position:absolute;left:12px;right:12px;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--teal)}
.badge{font:600 12px/18px var(--font-mono);color:var(--ink);background:var(--gold);border-radius:9px;padding:0 6px}
.drag{flex:1;min-width:24px}
.beside{display:flex;align-items:center;gap:2px;align-self:center;margin-right:10px;padding:2px;border:1px solid var(--line);border-radius:8px}
.beside .lbl{padding:0 6px 0 8px;font-size:12px;color:var(--fg-3)}
.beside button{display:flex;align-items:center;gap:6px;height:24px;padding:0 9px;border:0;border-radius:6px;background:none;color:var(--fg-2);font-size:13px}
.beside button:hover{background:var(--bg-hover);color:var(--fg)}
.beside button[aria-pressed="true"]{background:var(--select);color:var(--fg)}
.pal-btn{display:flex;align-items:center;gap:8px;align-self:center;height:28px;margin-right:8px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-m);background:none;color:var(--fg-2);font-size:13px}
.pal-btn:hover{border-color:var(--line-ctrl);color:var(--fg)}
.winctl{display:flex}
.winctl button{width:46px;border:0;background:none;color:var(--fg-2);display:grid;place-items:center}
.winctl button:hover{background:var(--bg-hover);color:var(--fg)}
.winctl button.close:hover{background:#C4453A;color:#fff}

/* строка закона */
.law{display:flex;align-items:center;gap:2px;padding:0 8px;background:var(--bg-sunk);border-bottom:1px solid var(--line);font-size:13px;min-width:0;overflow:hidden}
.seg{flex:none;display:flex;align-items:center;gap:6px;height:24px;padding:0 8px;border:0;border-radius:var(--r-m);background:none;color:var(--fg-3);white-space:nowrap}
.seg:hover{background:var(--bg-hover)}
.seg b{font-weight:600;color:var(--fg-2)}
.seg.overall b{color:var(--fg)}
.seg.is-warn b{color:var(--gold)} .seg.is-down b{color:var(--red-text)} .seg.is-live b{color:var(--teal)} .seg.is-off b{color:var(--fg-3)}
.seg img{height:13px;width:auto;filter:grayscale(1) brightness(1.6);opacity:.7}
.seg:not(.overall) .ico{color:var(--fg-3)}
.seg .why{color:var(--fg-2);font-weight:400}
.law .sep{flex:none;width:1px;height:16px;background:var(--line);margin:0 6px}
.law .spacer{flex:1}
.law .checked{min-width:0;overflow:hidden;text-overflow:ellipsis;font:400 12px var(--font-mono);color:var(--fg-3);padding:0 6px;white-space:nowrap}

/* виды */
.views{position:relative;display:grid;min-height:0;min-width:0}
.views[data-split]{grid-template-columns:minmax(0,1fr) 1px minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
.views[data-split]::before{content:"";grid-column:2;grid-row:1 / 3;background:var(--line)}
.side-head{display:none}
.views[data-split] .side-head{display:flex;grid-column:3;grid-row:1;align-items:center;gap:6px;height:36px;padding:0 8px 0 16px;background:var(--bg-sunk);border-bottom:1px solid var(--line);font-size:13px;color:var(--fg-2)}
.side-head b{font-weight:600;color:var(--fg);margin-right:auto}
.side-head .btn{height:26px;padding:0 8px}
.view{display:none;min-height:0;min-width:0;grid-row:1}
.view.is-on{display:grid;animation:viewin var(--t) var(--ease)}
.views[data-split] .view.is-left{grid-column:1;grid-row:1 / 3} .views[data-split] .view.is-right{grid-column:3;grid-row:2}
@keyframes viewin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

/* ---------- вид «Разговор» ---------- */
.v-talk{grid-template-rows:minmax(0,1fr) auto}
.scroll{overflow:auto;min-height:0;scrollbar-gutter:stable both-edges}
.col{max-width:var(--col);margin:0 auto;padding:0 24px}
.ledger{list-style:none;margin:0;padding:24px 0 12px}
.turn{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);column-gap:16px;padding:9px 0}
.gut{text-align:right;padding-top:3px;min-width:0}
.who{display:inline-flex;align-items:center;gap:7px;font-weight:600;font-size:13px;color:var(--fg-2)}
.who img{height:14px;width:auto}
.who .ico{width:14px;height:14px}
.when{display:block;font:400 12px var(--font-mono);color:var(--fg-3);margin-top:1px}
.body{min-width:0}
.prose{font-size:15px;line-height:1.58;max-width:70ch}
.prose p{margin:0 0 .55em} .prose p:last-child{margin-bottom:0}
[data-ledger-font="mono"] .prose{font:400 14px/1.6 var(--font-mono);max-width:84ch}
[data-ledger-font="mono"] .turn.owner .body{max-width:calc(84ch + 28px)}
.prose code,.inl{font:400 .87em var(--font-mono);background:#28282D;border-radius:var(--r-s);padding:1px 5px;color:#DCDCE2}
.turn.owner .who{color:var(--owner-text)}
.turn.owner .who .ico{color:var(--owner)}
.turn.owner .body{background:var(--owner-wash);border-radius:var(--r-l);padding:9px 14px;max-width:calc(70ch + 28px)}
.turn.note .body{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--fg-2);padding-top:3px}
.turn.note .body .ico{margin-top:2px}
.turn.note .who{font-weight:400;color:var(--fg-3)}
.turn.note.is-warn .body{color:var(--fg)} .turn.note.is-down .body{color:var(--fg)}
pre{margin:.6em 0 0;padding:12px 14px;background:var(--bg-code);border:1px solid var(--line);border-radius:8px;font:400 13px/1.55 var(--font-mono);overflow:auto;max-width:100%;color:var(--c-name)}
.k{color:var(--c-kw)} .s{color:var(--c-str)} .f{color:var(--c-fn)} .c{color:var(--c-com);font-style:italic} .n{color:var(--c-const)}

/* блоки: бриф мозга, найм рук, запрос гранта */
.blk{border:1px solid var(--line);border-radius:var(--r-l);background:var(--bg-raise)}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.sum{display:flex;align-items:center;gap:10px;padding:9px 14px;border-radius:var(--r-l)}
.sum:hover{background:var(--bg-hover)}
.sum .ico.chev{color:var(--fg-3);transition:transform var(--t) var(--ease)}
details[open]>.sum .ico.chev{transform:rotate(90deg)}
.sum-title{font-weight:600}
.meta{font-size:13px;color:var(--fg-2)}
.brief-body{padding:4px 16px 14px 40px;font-size:14px}
.brief-body ol{margin:0 0 10px;padding-left:18px} .brief-body li{margin:3px 0;max-width:72ch}
.expect{margin:8px 0 0;padding:0;list-style:none;font:400 13px/1.7 var(--font-mono);color:var(--fg-2)}
.expect li{display:flex;gap:8px;align-items:center}
.law-note{display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:var(--fg-2)}
.law-note .ico{color:var(--fg-3);margin-top:2px}

.job-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:11px 14px 6px}
.job-title{font-weight:600}
.id{font:400 12px var(--font-mono);color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--fg-2);border:1px solid var(--line);border-radius:999px;padding:0 8px;line-height:20px}
.chip .ico{width:12px;height:12px}
.stages{display:flex;flex-wrap:wrap;align-items:center;row-gap:4px;margin:0;padding:2px 14px 12px;list-style:none;font-size:13px}
.stage{display:flex;align-items:center;gap:6px;color:var(--fg-2)}
.stage+.stage::before{content:"";width:18px;height:1px;background:var(--line-ctrl);margin:0 10px 0 4px}
.stage b{font-weight:600;color:var(--fg)}
.stage .t{font-family:var(--font-mono);font-size:12px;color:var(--fg-3)}
.receipt{border-top:1px solid var(--line);padding:12px 14px 12px}
.verdict{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.verdict.ok{color:var(--green)}
.done{margin:4px 0 0 24px;font-size:14px;color:var(--fg-2);max-width:70ch}
.rows{margin:10px 0 0;padding:0;list-style:none;font:400 13px/1.75 var(--font-mono)}
.rows li{display:flex;align-items:center;gap:8px;min-width:0}
.rows .path{color:var(--fg);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rows .new{font-family:var(--font-ui);font-size:12px;color:var(--fg-3)}
.plus{color:var(--green)} .minus{color:var(--red-text)}
.rows .num{margin-left:auto;padding-left:16px;white-space:nowrap}
.rows-h{margin:12px 0 0;font-size:13px;color:var(--fg-2)}
.job-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.job-foot .meta{margin-left:auto}
.trace{border-top:1px solid var(--line)}
.trace .sum{border-radius:0 0 var(--r-l) var(--r-l);font-size:13px;color:var(--fg-2)}
.trace-list{margin:0;padding:0 14px 12px 40px;list-style:none;font:400 13px/1.8 var(--font-mono);color:var(--fg-2)}
.trace-list li{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center}
.trace-list .ms{color:var(--fg-3);font-size:12px}
.live-step{color:var(--fg)}

.ask{border:1px solid var(--gold-line);background:var(--gold-wash);border-radius:var(--r-l);padding:14px 16px}
.ask h3{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:15px;font-weight:600;color:var(--fg)}
.ask h3 .ico{color:var(--gold)}
.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 16px;margin:0 0 14px;font-size:14px}
.facts dt{color:var(--fg-2)} .facts dd{margin:0;min-width:0}
.facts .mono{font-size:13px}
.ask-actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 12px;border:1px solid var(--line-ctrl);border-radius:var(--r-m);background:none;color:var(--fg);font-weight:600;font-size:13px;white-space:nowrap;transition:background-color var(--t),border-color var(--t)}
.btn:hover{background:var(--bg-hover)}
.btn kbd{font-weight:400}
.btn-gold{border-color:var(--gold-line);color:var(--gold)} .btn-gold:hover{background:var(--gold-wash)}
.btn-quiet{border-color:transparent;color:var(--fg-2);font-weight:400} .btn-quiet:hover{color:var(--fg)}
.btn-danger{border-color:rgba(224,106,94,.55);color:var(--red-text)} .btn-danger:hover{background:var(--red-wash)}
.btn[disabled]{opacity:.55;cursor:default} .btn[disabled]:hover{background:none}

/* итог найма в ленте */
.jobw{position:relative}
.job{border:1px solid var(--line);border-radius:var(--r-l);background:var(--bg-raise)}
.job-sum{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:10px;row-gap:3px;padding:11px 190px 11px 14px;border-radius:var(--r-l)}
.job-sum:hover{background:var(--bg-hover)}
.job-sum .chev{grid-row:1 / 3;margin-top:3px;color:var(--fg-3);transition:transform var(--t) var(--ease)}
details.job[open]>.job-sum .chev{transform:rotate(90deg)}
.job-l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:600}
.job-l2{font-size:13px;color:var(--fg-2)}
.job-l2 .more{color:var(--fg-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-ctrl)}
.job-cta{position:absolute;top:10px;right:12px}
.job-body{border-top:1px solid var(--line)}
.job-body .job-head{padding-top:10px}
.w-gold{color:var(--gold)} .w-red{color:var(--red-text)} .w-teal{color:var(--teal)} .w-green{color:var(--green)}

/* подсказки по окну (F1) */
.help{position:fixed;inset:0;z-index:60}
.help[hidden]{display:none}
.help-scrim{position:absolute;inset:0;background:rgba(10,10,12,.55)}
.hm-box{position:fixed;border:1.5px dashed var(--teal-dim);border-radius:8px;pointer-events:none}
.hm-lbl{z-index:2;position:fixed;max-width:300px;padding:9px 12px;background:var(--bg-raise);border:1px solid var(--teal-dim);border-radius:8px;font-size:13px;line-height:1.45;color:var(--fg-2)}
.hm-lbl b{display:flex;align-items:center;gap:8px;margin-bottom:2px;font-size:14px;font-weight:600;color:var(--fg)}
.hm-tag{position:absolute;right:4px;top:4px}
.hm-n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--teal);color:var(--ink);font:600 12px var(--font-mono)}
.help-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 14px;border:1px solid var(--line-ctrl);border-radius:8px;background:var(--bg-raise);font-size:13px;color:var(--fg-2);white-space:nowrap}

/* низ: маскот, активность, композер */
.dock{position:relative;padding:6px 10px 10px;background:var(--bg)} /* 10px по бокам = scrollbar-gutter ленты: поле строго под текстом */
.dock .col{display:grid;grid-template-columns:var(--gutter) minmax(0,1fr);column-gap:16px}
.activity{display:contents}
.mascot{grid-column:1;justify-self:end;align-self:center;position:relative;width:34px;height:34px;margin:6px 0}
.mascot img{position:absolute;inset:1px;width:32px;height:32px}
.mascot .m-eyes{transform-origin:50% 51.5%;animation:blink 5.4s infinite}
.mascot .ring{position:absolute;inset:-3px;width:40px;height:40px;opacity:0}
.mascot[data-busy] .ring{opacity:1;animation:spin 1.8s linear infinite}
.mascot[data-busy] .m-body{animation:bob 1.2s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95.5%{transform:scaleY(.1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-1.5px)}}
.act{grid-column:2;display:flex;align-items:center;gap:10px;min-width:0;font-size:13px;color:var(--fg-2)}
.act .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act b{font-weight:600;color:var(--fg)}
.act .clock{font:400 12px var(--font-mono);color:var(--fg-3)}
.act .btn{margin-left:auto}
/* композер без рамки (раунд 5): продолжение ленты, та же сетка — гуттер 96 · 16 · текст */
.dock .col{position:relative;grid-template-rows:auto auto auto auto}
.dock .col::before{content:"";position:absolute;left:24px;right:24px;top:-6px;height:1px;background:var(--line);opacity:0;transition:opacity var(--t)}
.dock[data-seam] .col::before{opacity:1}
.dock .mascot,.dock .act{grid-row:1}
.att{grid-column:2;grid-row:2;display:flex;flex-wrap:wrap;gap:6px;padding:2px 0 4px}
.att[hidden]{display:none}
.achip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 2px 0 8px;border:1px solid var(--line);border-radius:6px;font:400 12px var(--font-mono);color:var(--fg)}
.achip .ico{width:14px;height:14px;color:var(--fg-3)}
.achip .sz{color:var(--fg-3)}
.achip button{width:22px;height:22px;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:var(--fg-3)}
.achip button .ico{width:12px;height:12px;color:currentColor}
.achip button:hover{background:var(--bg-hover);color:var(--fg)}
.ibtn{width:32px;height:32px;flex:none;display:grid;place-items:center;border:1px solid var(--line);border-radius:8px;background:none;color:var(--fg-2)}
.ibtn:hover,.ibtn[aria-expanded="true"]{border-color:var(--line-ctrl);color:var(--fg);background:var(--bg-hover)}
.plus{grid-column:1;grid-row:3;justify-self:end;align-self:end;margin-bottom:6px}
.cf{grid-column:2;grid-row:3;display:flex;align-items:flex-end;gap:4px;min-width:0;border-bottom:1px solid var(--line-ctrl);transition:border-color var(--t)}
.cf:focus-within{border-bottom-color:var(--teal-dim)}
.cf textarea{flex:1;min-width:0;display:block;height:44px;min-height:44px;max-height:190px;resize:none;border:0;outline:0;background:none;color:var(--fg);font:400 14px/22px var(--font-mono);caret-color:var(--teal);padding:11px 0;overflow-y:auto}
.cf textarea:focus-visible{outline:none}
.cf textarea::placeholder{color:var(--fg-3)}
.opt{width:32px;height:32px;margin-bottom:6px;flex:none;display:grid;place-items:center;border:0;border-radius:8px;background:none;color:var(--fg-2)}
.opt:hover,.opt[aria-expanded="true"]{background:var(--bg-hover);color:var(--fg)}
.send{width:36px;height:36px;margin-bottom:4px;flex:none;display:grid;place-items:center;border:0;border-radius:9px;background:var(--teal);color:var(--ink)}
.send .ico{width:20px;height:20px;stroke-width:2.2}
.send:hover{background:#5BFBF1}
.send[data-stop]{background:none;border:2px solid var(--gold);color:var(--gold)}
.send[data-stop]:hover{background:var(--gold-wash)}
.send[data-stop] .ico{width:14px;height:14px;fill:currentColor;stroke:none}
.rkey{grid-column:1;grid-row:4;justify-self:end;height:20px;margin-top:4px;font:400 12px/20px var(--font-mono);color:var(--fg-3);white-space:nowrap}
.route{grid-column:2;grid-row:4;display:flex;align-items:center;gap:6px;height:20px;margin-top:4px;min-width:0;font:400 12px/20px var(--font-mono);color:var(--fg-2);white-space:nowrap;overflow:hidden}
.route img{height:12px;width:auto}
.route .arr{color:var(--fg-3)}
.route .dest{font-weight:600;color:var(--fg)}
.route .rest{min-width:0;overflow:hidden;text-overflow:ellipsis}
.route .rnote{margin-left:auto;padding-left:12px;color:var(--fg-3)}
.route .rk-in{display:none;color:var(--fg-3)}
.route.is-refuse .dest{color:var(--red-text)}
.route.is-queue .dest{color:var(--gold)}
/* всплывающие: слэш-меню, «+», «···» — поверх ленты, над полем */
.pop{position:absolute;z-index:20;padding:4px;background:var(--bg-raise);border:1px solid var(--line-ctrl);border-radius:8px;font-size:13px;color:var(--fg)}
.pop[hidden]{display:none}
.sl-scroll{max-height:330px;overflow:auto}
.sl-g{padding:8px 10px 3px;font-size:12px;color:var(--fg-3)}
.sl-i{display:grid;grid-template-columns:136px minmax(0,1fr);align-items:center;column-gap:12px;height:30px;padding:0 10px;border-radius:6px;cursor:default}
.sl-i .cmd{font:400 13px var(--font-mono);color:var(--fg)}
.sl-i .hint{color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sl-i.is-warn .hint{color:var(--gold)}
.sl-i:hover{background:var(--bg-hover)}
.sl-i[aria-selected="true"]{background:var(--select)}
.sl-i[aria-selected="true"] .cmd{color:var(--teal)}
.sl-i[aria-selected="true"] .hint{color:var(--fg)}
.sl-empty{padding:10px;color:var(--fg-2)}
.sl-foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;padding:7px 10px 4px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3)}
.sl-foot kbd{color:var(--fg-2)}
.menu{width:380px}
.menu-h{padding:8px 10px 4px;font-size:12px;color:var(--fg-3)}
.menu-i{display:flex;align-items:center;gap:10px;width:100%;min-height:32px;padding:0 10px;border:0;border-radius:6px;background:none;color:var(--fg);font-size:13px;text-align:left}
.menu-i:hover{background:var(--bg-hover)}
.menu-i:disabled{color:var(--fg-3);background:none}
.menu-i .chk{width:16px;flex:none;display:grid;place-items:center;color:var(--fg-2)}
.menu-i .chk .ico{color:var(--fg-2)}
.menu-i .box{width:12px;height:12px;border:1px solid var(--line-ctrl);border-radius:3px}
.menu-i[aria-checked="true"] .chk .ico{color:var(--teal)}
.menu-i .sub{color:var(--fg-2)}
.menu-i .k{margin-left:auto;padding-left:12px;font:400 12px var(--font-mono);color:var(--fg-3)}
.menu-sep{height:1px;margin:4px 6px;background:var(--line)}
.seg4{display:flex;gap:2px;margin:2px 6px 6px;padding:2px;border:1px solid var(--line);border-radius:8px}
.seg4 button{flex:1;height:26px;border:0;border-radius:6px;background:none;color:var(--fg-2);font:400 12px var(--font-mono)}
.seg4 button:hover{color:var(--fg);background:var(--bg-hover)}
.seg4 button[aria-checked="true"]{background:var(--select);color:var(--fg)}
/* решение над полем: грант, повтор найма — в строке активности */
.act.is-ask{flex-wrap:wrap;gap:6px 10px;margin:3px 0;padding:5px 6px 5px 12px;border:1px solid var(--gold-line);border-radius:8px;background:var(--gold-wash)}
.act.is-ask .txt{display:flex;align-items:center;gap:8px;min-width:0}
.act .where{font:400 12px var(--font-mono);color:var(--fg-2);overflow:hidden;text-overflow:ellipsis}
.act .btns{display:flex;gap:6px;margin-left:auto}
.act .btns .btn{margin-left:0}
.act.is-fail .txt{display:flex;align-items:center;gap:8px}
/* альтернатива пропорций (a=1): поле во всю колонку, «+» внутри строки, как в живом окне */
.dock[data-alt] .plus{justify-self:start;z-index:1}
.dock[data-alt] .cf{grid-column:1 / 3;margin-left:44px}
.dock[data-alt] .att{grid-column:1 / 3;margin-left:44px}
.dock[data-alt] .route{grid-column:1 / 3;margin-left:44px}
.dock[data-alt] .rkey{display:none}
.dock[data-alt] .route .rk-in{display:inline}

/* ---------- вид «Состав и здоровье» ---------- */
.v-sostav{grid-template-columns:minmax(0,1fr) 380px}
.sv-main{overflow:auto;padding:20px 28px 28px;min-width:0}
.sv-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.sv-head h1{display:flex;align-items:center;gap:10px;margin:0;font-size:22px;font-weight:600;line-height:1.25}
.sv-head h1 .ico{width:18px;height:18px}
.sv-sub{margin-top:4px;font-size:13px;color:var(--fg-2)}
.sv-head .btn{margin-left:auto}
.map{position:relative;display:grid;grid-template-columns:88px repeat(3,minmax(0,1fr));column-gap:22px;row-gap:18px}
.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.edges path{fill:none;stroke:#44444C;stroke-width:1.5}
.edges path.warn{stroke:var(--gold);stroke-dasharray:4 4;opacity:.8}
.edges path.down{stroke:var(--red);stroke-dasharray:4 4;opacity:.85}
.edges path.off{stroke-dasharray:2 5}
.lane{align-self:center;font-size:13px;color:var(--fg-3)}
.node{position:relative;z-index:1;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:10px;align-items:start;min-height:52px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg-raise);text-align:left;transition:border-color var(--t),background-color var(--t)}
.node:hover{background:var(--bg-hover);border-color:#4A4A54}
.node:hover .node-mono{color:var(--fg-2)}
.node[aria-pressed="true"]{border-color:var(--teal-dim);background:#1F2A2A}
.node>.ico{margin-top:2px}
.node-name{display:flex;align-items:center;gap:7px;font-weight:600;font-size:14px;line-height:1.35}
.node-stamp{height:14px;width:auto}
.node-line{grid-column:2;font-size:13px;color:var(--fg-2);line-height:1.4}
.node-mono{grid-column:2;font:400 12px var(--font-mono);color:var(--fg-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node.is-warn .node-line{color:var(--gold)} .node.is-down .node-line{color:var(--red-text)} .node.is-live .node-line{color:var(--teal)}
.sv-sec{margin-top:26px}
.sv-sec h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--fg)}
.gates{display:grid;grid-template-columns:88px repeat(5,minmax(0,1fr));column-gap:12px}
.gates .node{min-height:56px}
.events{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.events li{display:grid;grid-template-columns:72px 18px 96px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.events .t{font:400 12px var(--font-mono);color:var(--fg-3)}
.events .part{color:var(--fg-2)}
.events .txt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.aside{min-width:0;overflow:auto;background:var(--bg-sunk);border-left:1px solid var(--line);padding:22px 22px 28px}
.a-head{display:flex;align-items:center;gap:10px}
.a-head img{width:28px;height:auto}
.a-head h2{margin:0;font-size:18px;font-weight:600}
.a-state{display:flex;align-items:center;gap:8px;margin:10px 0 0;font-size:14px;font-weight:600}
.a-state.is-ok{color:var(--green)} .a-state.is-warn{color:var(--gold)} .a-state.is-down{color:var(--red-text)} .a-state.is-off{color:var(--fg-2)} .a-state.is-live{color:var(--teal)}
.a-why{margin:4px 0 0 24px;font-size:13px;color:var(--fg-2)}
.a-what{margin:14px 0 0;font-size:14px;color:var(--fg);max-width:60ch}
.a-sec{margin-top:18px}
.a-sec h3{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--fg-2)}
.law-list{margin:0;padding:0;list-style:none;font-size:14px}
.law-list li{display:flex;gap:8px;align-items:flex-start;padding:3px 0}
.law-list .ico{margin-top:3px}
.law-list.can .ico{color:var(--green)} .law-list.cannot .ico{color:var(--red-text)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:13px}
.kv dt{color:var(--fg-3)} .kv dd{margin:0;color:var(--fg);font-family:var(--font-mono);overflow-wrap:anywhere}
.a-actions{display:flex;flex-wrap:wrap;gap:8px}
.a-events{margin:0;padding:0;list-style:none;font-size:13px}
.a-events li{display:grid;grid-template-columns:56px 16px minmax(0,1fr);gap:8px;align-items:start;padding:4px 0;color:var(--fg-2)}
.a-events .t{font:400 12px var(--font-mono);color:var(--fg-3);padding-top:1px}
.a-events .ico{margin-top:2px}

/* ---------- вид «Журнал» ---------- */
.v-journal{grid-template-rows:minmax(0,1fr);container-type:inline-size}
.jr{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:0}
.jr-list{display:flex;flex-direction:column;min-height:0;background:var(--bg-sunk);border-right:1px solid var(--line)}
.jr-tools{display:grid;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line)}
.jr-search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border:1px solid var(--line-ctrl);border-radius:8px;background:var(--bg);color:var(--fg-3)}
.jr-search:focus-within{border-color:var(--teal-dim)}
.jr-search input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--fg);font:400 14px var(--font-ui);caret-color:var(--teal)}
.jr-search input::placeholder{color:var(--fg-3)}
.chips{display:flex;flex-wrap:wrap;gap:2px}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 7px;border:0;border-radius:6px;background:none;color:var(--fg-2);font-size:13px}
.fchip:hover{background:var(--bg-hover);color:var(--fg)}
.fchip[aria-pressed="true"]{background:var(--select);color:var(--fg)}
.fchip .n{font:600 12px var(--font-mono)}
.jr-scroll{overflow:auto;min-height:0;margin:0;padding:2px 8px 16px;list-style:none}
.jr-day{padding:14px 8px 6px;font-size:12px;font-weight:600;color:var(--fg-3)}
.srow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:10px;row-gap:4px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:8px;background:none;text-align:left}
.srow:hover{background:var(--bg-hover)}
.srow:hover .s-time{color:var(--fg-2)}
.srow[aria-current="true"]{background:#1F2A2A;border-color:var(--teal-dim)}
.srow>.ico{margin-top:2px}
.s-title{font-weight:600;font-size:14px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.s-time{font:400 12px var(--font-mono);color:var(--fg-3);white-space:nowrap;padding-top:2px}
.s-meta{grid-column:2 / 4;display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;font-size:13px;color:var(--fg-2)}
.s-meta .word{font-weight:600}
.hcs{display:inline-flex;align-items:center;gap:8px}
.hc{display:inline-flex;align-items:center;gap:3px;font-family:var(--font-mono)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:18px;padding:0 7px;border:1px solid var(--line);border-radius:999px;color:var(--fg-2);white-space:nowrap}
.tag .ico{width:12px;height:12px}
.tag.gold{border-color:var(--gold-line);color:var(--gold)} .tag.red{border-color:rgba(224,106,94,.55);color:var(--red-text)} .tag.green{border-color:rgba(91,201,138,.5);color:var(--green)} .tag.teal{border-color:var(--teal-dim);color:var(--teal)}
.jr-more{display:flex;align-items:center;gap:8px;margin:10px 8px 0;font-size:13px;color:var(--fg-2)}
.jr-empty{padding:24px 10px;font-size:14px;color:var(--fg-2)}
.jr-detail{overflow:auto;min-height:0}
.jd{max-width:920px;padding:24px 32px 40px}
.jd-h{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.jd-sub{display:flex;flex-wrap:wrap;gap:2px 8px;margin:6px 0 0;font-size:13px;color:var(--fg-2)}
.jd-sub .mono{font-size:12px;color:var(--fg-3)}
.jd-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.jd-here{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--fg-2);margin-right:4px}
.jd-end{display:flex;gap:10px;align-items:flex-start;margin-top:20px;padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--bg-raise)}
.jd-end>.ico{margin-top:3px}
.jd-end.is-warn{border-color:var(--gold-line)} .jd-end.is-down{border-color:rgba(224,106,94,.55)} .jd-end.is-live{border-color:var(--teal-dim)}
.jd-end .lbl{font-size:13px;color:var(--fg-2)}
.jd-end p{margin:2px 0 0;font-size:15px;max-width:72ch}
.jd-facts{margin:12px 0 0;font-size:14px;color:var(--fg-2);max-width:78ch}
.jd-facts li{display:flex;align-items:center;gap:7px}
.jd-facts b{color:var(--fg);font-weight:600;font-family:var(--font-mono)}
.jd-facts img{height:14px;width:auto}
.jd h2{margin:28px 0 8px;font-size:14px;font-weight:600}
.tl{list-style:none;margin:0;padding:0}
.tl>li{display:grid;grid-template-columns:44px 84px minmax(0,1fr);column-gap:12px;padding:7px 0}
.tl .t{font:400 12px var(--font-mono);color:var(--fg-3);padding-top:3px}
.tl-who .who{font-size:13px}
.tl-who .owner-who{color:var(--owner-text)} .tl-who .owner-who .ico{color:var(--owner);width:14px;height:14px}
.tl-body{min-width:0;font-size:14px}
.tl-task{margin:0;max-width:78ch;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.tl-say,.tl-meta{margin:0;max-width:78ch;color:var(--fg-2)}
.tl-ev{display:flex;gap:8px;align-items:flex-start;margin:0}
.tl-ev .ico{margin-top:2px} .tl-ev b{font-weight:600}
.tl-grant{display:flex;flex-direction:column;gap:2px}
.tl-grant b{font-weight:600} .tl-grant .mono{font-size:13px;color:var(--fg-2)} .tl-grant .meta{font-size:13px}
.jh{border:0;border-radius:8px;background:var(--bg-raise)}
.jh-sum{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:8px;row-gap:3px;padding:9px 12px;border-radius:8px}
.jh-sum:hover{background:var(--bg-hover)}
.jh-sum .chev{grid-row:1 / 3;margin-top:2px;color:var(--fg-3);transition:transform var(--t) var(--ease)}
details.jh[open]>.jh-sum .chev{transform:rotate(90deg)}
.jh-l1{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.jh-l1 b{font-weight:600}
.jh-l2{font-size:13px;color:var(--fg-2)}
.v-ok{color:var(--green)} .v-warn{color:var(--gold)} .v-fail{color:var(--red-text)} .v-live{color:var(--teal)}
.jh-body{padding:2px 14px 14px 36px;border-top:1px solid var(--line)}
.jh-why{margin:10px 0 0;font-size:14px;max-width:72ch}
.tail{margin:6px 0 0;color:var(--red-text)}
.jh-act{margin-top:12px}
@container (max-width:1000px){.jr{grid-template-columns:300px minmax(0,1fr)}.jd{padding:20px 22px 32px}}
@container (max-width:760px){.jr{grid-template-columns:minmax(0,1fr);grid-template-rows:250px minmax(0,1fr)}.jr-list{border-right:0;border-bottom:1px solid var(--line)}.tl>li{grid-template-columns:44px 72px minmax(0,1fr)}}

/* ---------- вид «Дифф» ---------- */
.v-diff{grid-template-rows:minmax(0,1fr);container-type:inline-size}
.df{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
.df-list{overflow:auto;min-height:0;padding:4px 8px 16px;background:var(--bg-sunk);border-right:1px solid var(--line)}
.df-h{display:flex;align-items:center;gap:6px;padding:14px 8px 6px;font-size:12px;font-weight:600;color:var(--fg-3)}
.df-h .n{font-family:var(--font-mono);color:var(--gold)}
.df-list ol{list-style:none;margin:0;padding:0}
.dq{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:10px;row-gap:2px;width:100%;padding:9px 10px;border:1px solid transparent;border-radius:8px;background:none;text-align:left}
.dq:hover{background:var(--bg-hover)}
.dq[aria-current="true"]{background:#1F2A2A;border-color:var(--teal-dim)}
.dq>.ico{margin-top:2px}
.dq-t{font-weight:600;font-size:14px;line-height:1.35}
.dq-m{grid-column:2;font-size:13px;color:var(--fg-2)}
.df-main{overflow:auto;min-height:0}
.dm{max-width:1120px;padding:0 32px 56px}
.dm-top{position:sticky;top:0;z-index:2;padding:22px 0 14px;background:var(--bg);border-bottom:1px solid var(--line)}
.dm-h{margin:0;font-size:22px;font-weight:600;line-height:1.3}
.dm-sub{margin:4px 0 0;font-size:13px;color:var(--fg-2)}
.dm-actions{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:14px}
.btn-primary{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.btn-primary:hover{background:#5BFBF1}
.btn-primary[disabled]{background:none;border-color:var(--line-ctrl);color:var(--fg-2);opacity:1}
.dm-cons{display:flex;gap:8px;align-items:flex-start;margin:10px 0 0;font-size:13px;color:var(--fg-2);max-width:92ch}
.dm-cons .ico{margin-top:1px}
.dm-done{display:flex;gap:8px;align-items:center;margin:12px 0 0;font-size:14px}
.dm-rej{max-width:780px;margin-top:12px;padding:12px 14px;border:1px solid var(--line-ctrl);border-radius:10px;background:var(--bg-raise)}
.dm-rej label{display:block;margin-bottom:6px;font-size:13px;color:var(--fg-2)}
.dm-rej textarea{display:block;width:100%;min-height:54px;resize:vertical;padding:8px 10px;border:1px solid var(--line-ctrl);border-radius:8px;background:var(--bg);color:var(--fg);font:400 14px/1.5 var(--font-ui);caret-color:var(--teal)}
.dm-rej textarea:focus{outline:none;border-color:var(--teal-dim)}
.dm-rej textarea::placeholder{color:var(--fg-3)}
.dm-rej .dm-actions{margin-top:10px}
.dm-ctx{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:18px}
.dm-ctx .lbl{margin-bottom:3px;font-size:13px;color:var(--fg-2)}
.dm-ctx p{margin:0;font-size:14px;max-width:62ch}
.dm-fh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;margin-top:22px;font-size:13px;color:var(--fg-2)}
.dm-fh b{font-weight:600;color:var(--fg)}
.dm-fh .keys{margin-left:auto}
.dm-fh .keys kbd{color:var(--fg-2)}
.dm-index{list-style:none;margin:8px 0 0;padding:0}
.dm-index button{display:flex;align-items:center;gap:8px;width:100%;padding:3px 6px;border:0;border-radius:6px;background:none;font:400 13px/1.7 var(--font-mono);color:var(--fg);text-align:left}
.dm-index button:hover{background:var(--bg-hover)}
.dm-index .num{margin-left:auto}
.fs{margin-top:16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;scroll-margin-top:190px}
.fs-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--bg-raise);font-size:13px}
.fs:not(.is-viewed) .fs-h{border-bottom:1px solid var(--line)}
.fs-h .path{font:600 13px var(--font-mono);color:var(--fg)}
.fs-h .num{margin-left:auto;font-family:var(--font-mono)}
.fs-v{display:flex;align-items:center;gap:6px;padding-left:12px;color:var(--fg-2);cursor:pointer}
.fs-v input{width:14px;height:14px;margin:0;accent-color:var(--teal)}
.fs.is-viewed .fs-h .path{color:var(--fg-2)}
.fs-b{overflow:auto}
.dt{width:100%;border-collapse:collapse;font:400 13px/1.6 var(--font-mono)}
.dt td{padding:0 10px;white-space:pre;vertical-align:top}
.dt .ln{width:1%;padding:0 8px;text-align:right;color:var(--fg-3);user-select:none}
.dt .mk{display:inline-block;width:14px;color:var(--fg-3)}
.dt tr.ad{background:rgba(91,201,138,.09)} .dt tr.ad .mk{color:var(--green)}
.dt tr.dl{background:rgba(224,106,94,.09)} .dt tr.dl .mk{color:var(--red-text)}
.dt tr.ad .ln,.dt tr.dl .ln{color:var(--fg-2)}
.dt tr.hk td{padding:4px 12px;background:#1F1F27;color:#A3A3DC;font-family:var(--font-ui)}
.dt tr.more td{padding:6px 12px;font-family:var(--font-ui);color:var(--fg-2)}
.linkbtn{padding:0;border:0;background:none;color:var(--fg-2);font:inherit;text-decoration:underline;text-underline-offset:3px}
@container (max-width:1000px){.df{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}.df-list{max-height:200px;border-right:0;border-bottom:1px solid var(--line)}.dm{padding:0 20px 40px}.dm-ctx{grid-template-columns:1fr}.dm-fh .keys{display:none}}

/* ---------- заглушки ---------- */
.v-stub{overflow:auto}
.stub{max-width:720px;margin:0 auto;padding:48px 24px}
.stub h1{margin:0 0 8px;font-size:22px;font-weight:600}
.stub p{margin:0 0 12px;font-size:15px;color:var(--fg-2);max-width:66ch}
.stub ul{margin:0 0 16px;padding-left:18px;font-size:15px;color:var(--fg)} .stub li{margin:4px 0}
.waiting{margin:20px 0 0;padding:0;list-style:none;border-top:1px solid var(--line)}
.waiting li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.waiting .mono{font-size:13px}
.waiting .btn{margin-left:auto}

/* ---------- палитра ---------- */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(10,10,12,.6)}
.scrim[hidden]{display:none}
.pal{position:fixed;z-index:51;left:50%;top:13vh;transform:translateX(-50%);width:min(640px,calc(100vw - 48px));background:var(--bg-raise);border:1px solid var(--line-ctrl);border-radius:12px;animation:palin var(--t) var(--ease)}
.pal[hidden]{display:none}
@keyframes palin{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}
.pal-in{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.pal-in:focus-within{border-bottom-color:var(--teal-dim)}
.pal-in .ico{color:var(--fg-3)}
.pal-in input{flex:1;border:0;outline:0;background:none;color:var(--fg);font:400 15px var(--font-ui);caret-color:var(--teal)}
.pal-in input::placeholder{color:var(--fg-3)}
.pal-list{max-height:min(460px,60vh);overflow:auto;margin:0;padding:6px;list-style:none}
.pal-g{padding:10px 10px 4px;font-size:12px;font-weight:600;color:var(--fg-3)}
.pal-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:var(--r-m);font-size:14px;cursor:pointer}
.pal-item[aria-selected="true"]{background:var(--select)}
.pal-item .sub{color:var(--fg-3);font-size:13px}
.pal-item kbd{margin-left:auto}
.pal-item[aria-selected="true"] .sub,.pal-item[aria-selected="true"] kbd{color:var(--fg)}
.pal-empty{padding:16px;color:var(--fg-2);font-size:14px}
.pal-foot{display:flex;gap:16px;padding:8px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--fg-3)}

/* анимации выключаются флагом окна и системной настройкой */
[data-motion="off"] *,[data-motion="off"] *::before,[data-motion="off"] *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

@media (max-width:1280px){.v-sostav{grid-template-columns:minmax(0,1fr) 320px}.gates{grid-template-columns:88px repeat(3,minmax(0,1fr));row-gap:12px}.gates .node:nth-child(n+5){grid-column:auto}}

<script>
"use strict";
const A = "../../assets/";
const STAMP = {mouth: A+"mascot/roles/mouth-32.png", brain: A+"mascot/roles/brain-32.png", hands: A+"mascot/roles/hands-32.png"};
const $ = (s, r=document) => r.querySelector(s);
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = (id, cls="") => `<svg class="ico ${cls}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const stamp = (r, h=14) => `<img src="${STAMP[r]}" alt="" style="height:${h}px">`;
const ST_ICON = {ok:"ok", warn:"warn", down:"down", off:"off", live:"live"};
const ST_WORD = {ok:"работает", warn:"с оговоркой", down:"лежит", off:"выключено", live:"работает сейчас"};
const stIco = st => ico(ST_ICON[st], "st-"+st);

const PROJECTS = [
  {id:"fractalos",     path:"C:\\FractalOS",       rule:"fractal-корень · руки правят копию, итог — дифф"},
  {id:"fractalmem",    path:"C:\\fractalmem",      rule:"fractal-корень · копия и дифф"},
  {id:"fractalprofit", path:"C:\\fractalprofit",   rule:"fractal-корень · копия и дифф"},
  {id:"metrprod",      path:"D:\\work\\metrprod",  rule:"внешний проект · живёт по своим правилам"},
];

/* ---------- сценарии прототипа ---------- */
function scenario(name){
  const s = {
    name, project:"fractalos", checked:"14:32:05", policy:"grant",
    mouth:{prov:"Grok", st:"ok"},
    brain:{on:true, prov:"Grok", st:"ok", why:""},
    hands:{on:true, busy:false},
    mem:{st:"ok", atoms:212},
    grant:{st:"none"},
    lock:{holder:null},
    diffs:2, running:false, mouthBusy:false, retry:false, draft:""
  };
  if (name==="hire" || name==="grant"){
    s.checked="14:41:12"; s.running=true; s.hands.busy=true;
    s.lock={holder:"руки · найм 3f9a1c2e", since:"14:37"};
  }
  if (name==="grant"){ s.grant={st:"asked"}; }
  if (name==="busy"){ s.checked="14:33:40"; s.mouthBusy=true; }
  if (name==="retry"){ s.checked="14:39:30"; s.retry=true; }
  if (name==="degraded"){
    s.checked="14:28:40";

  const brainVal = !s.brain.on ? "выключен" : s.brain.st==="warn" ? "Flash, запасной" : s.brain.prov;

  const writer = s.lock.holder ? s.lock.holder.split(" · ")[0] : "никто";

  $("#law").innerHTML = overall + `<span class="sep"></span>`
   + `<button class="seg" data-go="mouth" title="Рот — с кем вы говорите в чате">${stamp("mouth",12)}рот <b>${s.mouth.prov}</b></button>`

   + `<button class="seg ${s.lock.holder?"is-live":""}" data-go="lock" title="Кто сейчас пишет в проект. Пока пишет один, второй не может${s.lock.holder?": "+esc(s.lock.holder):""}">${ico("lock")}пишет: <b>${esc(writer)}</b></button>`

    const x2 = B1.left + B1.width/2 - mb.left, y2 = B1.top - mb.top;
    const ym = y1 + (y2-y1)/2;
    const st = ns.find(n=>n.id===b).st;
    const cls = st==="down"?"down":st==="warn"?"warn":st==="off"?"off":"";
    return `<path class="${cls}" d="M${x1} ${y1}V${ym}H${x2}V${y2}"/>`;
  }).join("");
}

  if (d.can.length) h += `<div class="a-sec"><h3>Может</h3><ul class="law-list can">${d.can.map(c=>`<li>${ico("check")}<span>${esc(c)}</span></li>`).join("")}</ul></div>`;

}

function showHelp(){

  }).join("");

  if (a==="hands"){ S.hands.on=!S.hands.on; if(!S.hands.on) S.hands.busy=false; }
  if (a==="grant30"){ S.grant={st:"open", until:"15:12"}; }
  if (a==="grant480"){ if (confirm("Выдать грант на 8 часов? Руки будут писать вне песочницы без вопросов до 22:42. Снять можно в строке закона.")) S.grant={st:"open", until:"22:42"}; }
  if (a==="deny"){ S.grant={st:"denied"}; }
  if (a==="revoke"){ S.grant={st:"none"}; }
  if (a==="stopMouth"){ S.mouthBusy=false; UI.extra.push(T.note("14:33","info","ответ рта остановлен вами — то, что он успел написать, осталось в ленте")); }
  if (a==="retry"){ S.retry=false; S.running=true; S.hands.busy=true; S.lock={holder:"руки · найм 3f9a1c2e", since:"14:40"}; UI.extra.push(T.note("14:40","info","найм повторён вами тем же брифом — руки начали заново в новой копии дерева")); }
  if (a==="stop"){ S.running=false; S.hands.busy=false; S.lock={holder:null}; UI.extra.push(T.note("14:42","info","работа снята вами — найм 3f9a1c2e остановлен, рот не тронут")); }
  renderAll();
}

/* ---------- состояние в адресе (для снимков) ---------- */
function syncHash(){
  const p = new URLSearchParams(); p.set("s",S.name); p.set("v",UI.view); p.set("sel",UI.sel);
  if (UI.side) p.set("side",UI.side);
  if (UI.view==="journal" || UI.side==="journal"){ p.set("j",UI.js); if (UI.jf!=="all") p.set("jf",UI.jf); if (UI.jq) p.set("q",UI.jq); }
  if (UI.view==="diff" || UI.side==="diff") p.set("d",UI.dsel);
  history.replaceState(null,"","#"+p.toString());
}
function load(name){ S = scenario(name); UI.extra=[]; UI.chips=[]; UI.hAt=null; DOVR={}; UI.dview={}; UI.drej=false; $("#field").value = S.draft; autosize(); renderAll(); syncHash(); }
function fromHash(){
  const p = new URLSearchParams(location.hash.slice(1));
  S = scenario(p.get("s")||"ok"); UI.extra=[];
  UI.view = p.get("v")||"talk"; UI.sel = p.get("sel")||"hands"; UI.side = p.get("side")||null;
  UI.js = p.get("j")||"cur"; UI.jf = p.get("jf")||"all"; UI.jq = p.get("q")||""; $("#jSearch").value = UI.jq;
  DOVR = {}; UI.dview = {}; UI.dsel = p.get("d")||"7c1e40b2"; UI.drej = p.get("rej")==="1"; UI.dfile = 0;
  if (p.get("dv")) { const d = dget(UI.dsel); d.files.slice(0, +p.get("dv")).forEach(f=>UI.dview[d.id+":"+f.path]=true); }
  if (p.get("done")==="apply") { const d = dget(UI.dsel); d.files.forEach(f=>UI.dview[d.id+":"+f.path]=true); DOVR[d.id] = {st:"applied", at:"сегодня в 14:52"}; UI.extra.push(T.note("14:52","ok",`дифф найма ${d.id} применён вами: ${d.files.length} файла записаны в ${esc(d.root)}`)); }
  document.body.dataset.ledgerFont = p.get("f")==="sans" ? "sans" : "mono";
  UI.c = p.get("c")||""; UI.alt = p.get("a")==="1"; UI.chips = []; UI.hAt = null; UI.plan = false; UI.multi = false; closePops();
  $("#dock").toggleAttribute("data-alt", UI.alt);
  let draft = S.draft;
  if (UI.c==="multi"){ draft = "Сделай строку статуса тише:\n— инфо гаснет через 8 с, предупреждение и сбой держатся;\n— не мигать при каждом новом сообщении;\n— как должно выглядеть — на снимке."; UI.chips = [["status-mock.png","48 КБ"]]; }
  if (UI.c==="slash") draft = "/";
  if (UI.c==="hire") draft = "найми: добавь тон ко всем оставшимся вызовам set_note в app/window.py";
  if (UI.c==="btw") draft = "/btw сколько сейчас занято контекста?";
  if (S.name==="busy") draft = "И заодно проверь, что старые вызовы без тона работают как «инфо».";
  $("#field").value = draft; autosize();
  UI.slashOn = /^\/\S*$/.test(draft); UI.slIdx = 0;
  renderAll(); autosize();
  if (UI.c || S.name==="busy"){ const f = $("#field"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }
  renderSlash(); renderRoute();
  if (UI.c==="opts") openPop("opt"); if (UI.c==="plus") openPop("plus");
  if (p.get("help")) requestAnimationFrame(showHelp); else if (UI.help) hideHelp();
  if (p.get("palette")) openPalette(p.get("palette")==="project"?"project":"all");
  else if (UI.palette) closePalette();
}
function renderAll(){ renderDiff(); renderLaw(); renderLedger(); renderActivity(); renderChips(); renderRoute(); renderSostav(); renderJournal(); renderViews(); }

/* ---------- события ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("[data-view],[data-go],[data-node],[data-act],[data-i],[data-side],[data-full],[data-sess],[data-jf],[data-open-talk],[data-export],[data-archive],[data-jreset],[data-diff],[data-dsel],[data-dact],[data-dfile]");
  if (!t) return;
  if (t.dataset.view){ setView(t.dataset.view); return; }
  if (t.dataset.side){ toggleSide(t.dataset.side); return; }
  if (t.dataset.full){ setView(t.dataset.full); return; }
  if (t.dataset.go){ UI.sel=t.dataset.go; if (UI.side) UI.side="sostav"; else UI.view="sostav"; renderSostav(); renderViews(); syncHash(); return; }
  if (t.dataset.node){ UI.sel=t.dataset.node; renderSostav(); syncHash(); return; }
  if (t.dataset.sess){ UI.js=t.dataset.sess; renderJournal(); syncHash(); return; }
  if (t.dataset.jf){ UI.jf=t.dataset.jf; renderJournal(); syncHash(); return; }
  if (t.dataset.diff){ openDiff(t.dataset.diff); return; }
  if (t.dataset.dsel){ UI.dsel = t.dataset.dsel; UI.drej = false; UI.dfile = 0; renderDiff(); syncHash(); $("#dfMain").scrollTop = 0; return; }
  if (t.dataset.dact){ dAct(t.dataset.dact); return; }
  if (t.dataset.dfile){ dGoFile(+t.dataset.dfile); return; }
  if (t.dataset.jreset){ UI.jf="all"; UI.jq=""; $("#jSearch").value=""; renderJournal(); syncHash(); return; }
  if (t.dataset.openTalk){ const ss = jDays().flatMap(d=>d.ss).find(x=>x.id===t.dataset.openTalk); UI.extra.push(T.note("14:44","info",`прототип: здесь открылась бы сессия «${esc(ss.title)}» — лента, композер и её наймы`)); setView("talk"); renderLedger(); return; }
  if (t.dataset.export){ t.textContent = "Сохранено: session.md"; return; }
  if (t.dataset.archive){ const ss = jDays().flatMap(d=>d.ss).find(x=>x.id===t.dataset.archive); confirm(`Убрать сессию «${ss.title}» в архив? Файлы на диске останутся, вернуть можно из архива.`); return; }
  if (t.dataset.i!==undefined){ runPalette(+t.dataset.i); return; }
  if (t.dataset.act!==undefined && t.dataset.act) act(t.dataset.act);
});
$("#projBtn").addEventListener("click", ()=>openPalette("project"));
document.addEventListener("change", e=>{ const k = e.target.dataset && e.target.dataset.viewed; if (!k) return; UI.dview[k] = e.target.checked; const y = $("#dfMain").scrollTop; renderDiff(); $("#dfMain").scrollTop = y; });
$("#help").addEventListener("click", hideHelp);
$("#jSearch").addEventListener("input", e=>{ UI.jq = e.target.value; renderJournal(); syncHash(); });
$("#jSearch").addEventListener("keydown", e=>{ if (e.key!=="Escape") return; e.stopPropagation(); if (e.target.value){ e.target.value=""; UI.jq=""; renderJournal(); syncHash(); } else e.target.blur(); });
$("#jList").addEventListener("keydown", e=>{ if (e.key==="ArrowDown"){ e.preventDefault(); jMove(1); } if (e.key==="ArrowUp"){ e.preventDefault(); jMove(-1); } });
$("#scrim").addEventListener("click", closePalette);
$("#palInput").addEventListener("input", ()=>{UI.palIdx=0; renderPalette();});
$("#palInput").addEventListener("keydown", e=>{
  if (e.key==="ArrowDown"){ e.preventDefault(); UI.palIdx=Math.min(UI.palIdx+1, palItems.length-1); renderPalette(); }
  if (e.key==="ArrowUp"){ e.preventDefault(); UI.palIdx=Math.max(UI.palIdx-1, 0); renderPalette(); }
  if (e.key==="Enter"){ e.preventDefault(); runPalette(UI.palIdx); }
});
$("#field").addEventListener("input", ()=>{ autosize(); onField(); });
$("#field").addEventListener("keydown", e=>{
  const f = e.target, slash = !$("#slash").hidden;
  if (slash && UI.slItems.length){
    if (e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); UI.slIdx = (UI.slIdx + (e.key==="ArrowDown"?1:-1) + UI.slItems.length) % UI.slItems.length; renderSlash(); renderRoute(); return; }
    if (e.key==="Tab" && !e.shiftKey){ e.preventDefault(); slComplete(); return; }
    if (e.key==="Enter" && !e.shiftKey){ e.preventDefault(); slRun(); return; }
  }
  if (e.key==="Escape" && (slash || UI.pop)){ e.preventDefault(); e.stopPropagation(); UI.slashOn = false; renderSlash(); closePops(); renderRoute(); return; }
  if (e.key==="Enter"){ const go = UI.multi ? e.shiftKey : !e.shiftKey; if (go){ e.preventDefault(); $("#composer").requestSubmit(); } return; }
  const walking = UI.hAt!==null && f.value===HIST[UI.hAt];
  if ((e.key==="ArrowUp" || e.key==="ArrowDown") && (!f.value.trim() || walking)){
    if (e.key==="ArrowDown" && UI.hAt===null) return;
    e.preventDefault();
    const at = e.key==="ArrowUp" ? Math.max(0, (UI.hAt===null ? HIST.length : UI.hAt) - 1) : UI.hAt + 1;
    if (at >= HIST.length){ UI.hAt = null; f.value = ""; } else { UI.hAt = at; f.value = HIST[at]; }
    autosize(); renderRoute(); return;
  }
});
$("#composer").addEventListener("submit", e=>{
  e.preventDefault();
  if (S.mouthBusy && e.submitter===$("#send")){ act("stopMouth"); return; }
  const v = $("#field").value.trim(); if (!v) return;
  if (v.startsWith("/btw")) UI.extra.push(T.note("14:44","info","вопрос в сторону: ответ пришёл бы в рамке над полем, основной разговор не прерывается"));
  else if (v.startsWith("/")){ $("#field").value=""; autosize(); runCmd(v.split(/\s/)[0]); onField(); return; }
  else {
    UI.extra.push(T.owner("14:44", `<p>${esc(v)}</p>`));
    UI.extra.push(T.note("14:44","info", S.mouthBusy ? "в очереди: уйдёт рту, когда он закончит ответ" : "прототип: ответ рта здесь не моделируется"));
  }
  HIST.push(v); UI.hAt = null; UI.chips = [];
  $("#field").value=""; autosize(); renderChips(); renderLedger(); onField();
});
$("#dock").addEventListener("click", e=>{
  const t = e.target.closest("[data-sl],[data-unchip],[data-opt],[data-plus],[data-effort],#optBtn,#plusBtn");
  if (!t) return;
  if (t.id==="optBtn" || t.id==="plusBtn"){ const w = t.id==="optBtn" ? "opt" : "plus"; if (UI.pop===w){ closePops(); } else openPop(w, e.detail===0); return; }
  if (t.dataset.sl!==undefined){ UI.slIdx = +t.dataset.sl; slComplete(); return; }
  if (t.dataset.unchip!==undefined){ UI.chips.splice(+t.dataset.unchip, 1); renderChips(); return; }
  if (t.dataset.effort){ UI.effort = t.dataset.effort; renderOpt(); return; }
  if (t.dataset.opt==="plan"){ UI.plan = !UI.plan; renderOpt(); renderRoute(); return; }
  if (t.dataset.opt==="multi"){ UI.multi = !UI.multi; renderOpt(); renderRoute(); renderActivity(); return; }
  if (t.dataset.opt==="ask"){ closePops(); UI.extra.push(T.note("14:44","info","вопрос о правилах памяти: ответ пришёл бы в рамке над полем, рот его не видит")); renderLedger(); return; }
  if (t.dataset.plus){
    const w = t.dataset.plus; closePops();
    if (w==="file") UI.chips.push(["notes.md","3 КБ"]);
    if (w==="paste") UI.chips.push(["снимок-14-44.png","212 КБ"]);
    if (w==="drop") UI.chips = [];
    renderChips();
    if (w==="slash"){ setField("/"); return; }
    $("#field").focus();
  }
});
document.addEventListener("mousedown", e=>{ if (UI.pop && !e.target.closest(".pop,#optBtn,#plusBtn")) closePops(); });
document.addEventListener("keydown", e=>{ if (e.key==="Escape" && UI.pop && !e.target.closest("#field")){ e.preventDefault(); e.stopImmediatePropagation(); const b = UI.pop==="opt" ? $("#optBtn") : $("#plusBtn"); closePops(); b.focus(); } }, true);
$("#ledgerScroll").addEventListener("scroll", seam);
document.addEventListener("keydown", e=>{
  if (e.key==="F1"){ e.preventDefault(); toggleHelp(); return; }
  if (e.key==="Escape" && UI.help){ e.preventDefault(); hideHelp(); return; }
  if (e.key==="Escape"){ if (UI.palette){ e.preventDefault(); closePalette(); return; } if (S.mouthBusy){ act("stopMouth"); return; } if (S.running){ act("stop"); return; } }
  const typing = /^(INPUT|TEXTAREA)$/.test(e.target.tagName);
  if (!typing && !e.ctrlKey && !e.altKey && (UI.view==="diff" || UI.side==="diff")){
    if (e.key==="]"||e.key==="ъ"){ e.preventDefault(); dGoFile(UI.dfile+1); return; }
    if (e.key==="["||e.key==="х"){ e.preventDefault(); dGoFile(UI.dfile-1); return; }
    if (e.key==="v"||e.key==="V"||e.key==="м"||e.key==="М"){ e.preventDefault(); const d = dget(UI.dsel), f = d.files[UI.dfile]; if (f && d.st==="wait"){ const k = d.id+":"+f.path; UI.dview[k] = !UI.dview[k]; renderDiff(); dGoFile(UI.dfile); } return; }
  }
  if (!e.ctrlKey || e.altKey) return;
  const k = e.key.toLowerCase();
  if (["1","2","3","4"].includes(k)){ e.preventDefault(); setView(VIEWS[+k-1][0]); }
  else if (k==="k"){ e.preventDefault(); UI.palette?closePalette():openPalette("all"); }
  else if (k==="p"||k==="з"){ e.preventDefault(); openPalette("project"); }
  else if (k==="\\"){ e.preventDefault(); toggleSide(); }
  else if ((k==="f"||k==="а") && (UI.view==="journal" || UI.side==="journal")){ e.preventDefault(); $("#jSearch").focus(); }
});
window.addEventListener("resize", ()=>requestAnimationFrame(()=>{ autosize(); renderSlash(); drawEdges(); if (UI.help) showHelp(); }));
window.addEventListener("hashchange", fromHash);
fromHash();
document.fonts.ready.then(()=>{ autosize(); toBottom(); drawEdges(); if (UI.help) requestAnimationFrame(showHelp); });
</script>
</body>
